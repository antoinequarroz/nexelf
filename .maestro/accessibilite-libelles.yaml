      - tapOn: "Réglages"
      - assertVisible: "Habitudes et routines"
      - assertVisible: "Mémoire"
      - assertVisible: "Notifications"
      - tapOn: "Notifications"
      - assertVisible: "Briefing du matin"
      - assertVisible: "Revue du soir"
      - assertVisible: "Priorité planifiée"
